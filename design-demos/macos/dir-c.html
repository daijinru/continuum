in-height:0;flex:1}.rail{width:190px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:22px 10px;display:flex;flex-direction:column;gap:4px}.rail p{padding:6px 10px}.rail button{display:flex;align-items:center;gap:10px;text-align:left}.rail .sel{background:#dce2df;font-weight:600}.main{flex:1;min-width:0;display:flex;flex-direction:column}.scroll{overflow:auto;min-height:0;flex:1}.reading{width:min(100%,760px);margin:auto;padding:24px 30px}.meta{font-size:12px;color:var(--mut);margin-bottom:5px}.date{text-align:center;font-size:12px;color:var(--mut);margin:4px 0 18px}.bubble{display:table;margin:0 0 16px auto;background:var(--pale);border-radius:13px 13px 4px 13px;padding:9px 14px;max-width:86%}.message{border-bottom:1px solid var(--line);padding:7px 0 15px;margin-bottom:13px}.message h2{margin:4px 0 8px}.message p{max-width:62ch}.meta .icon{width:15px;height:15px}.tools{gap:6px;flex-wrap:wrap;margin-top:7px}.tools button{color:var(--tint);font-size:13px}.extra{padding:10px 14px;margin-top:6px;border-left:2px solid #8ab4a6;background:var(--pale);line-height:1.65}.composer{padding:12px 20px;flex:none;border-top:1px solid var(--line);background:var(--paper)}.entry{border:1px solid #acb8b2;border-radius:9px;padding:4px 7px 4px 12px;background:var(--paper)}.entry:focus-within{outline:2px solid var(--tint);outline-offset:1px}.entry textarea{resize:none;width:100%;background:transparent;border:0;outline:none;line-height:1.5;min-height:32px;padding:6px 0;font-size:14px}.entry button{width:38px;background:var(--tint);color:white;flex:none}.hint{margin-top:4px}.context{font-size:12px;color:var(--tint)}.context:empty{display:none}.context button{min-height:28px}.log p{border-left:2px solid #afc3bb;padding:6px 12px;margin:8px 0;white-space:pre-line}.log b{display:block;font-size:12px;color:var(--mut)}.statusdot{width:7px;height:7px;border-radius:50%;background:#438466}.tasklist{padding:0;list-style:none}.tasklist li{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.tasklist li span{margin-left:auto;color:var(--mut);font-size:12px}.iconbtn{display:inline-flex;align-items:center;justify-content:center}.compact-only{display:none}

</style><body class="c"><div class="preview"><strong>交互预览 <span>／ 示例数据</span></strong><nav class="switch" aria-label="切换设计方向"><a href="dir-a.html" >A 对话工作台</a><a href="dir-b.html" >B 交付阅读器</a><a href="dir-c.html" aria-current="page">C 快速面板</a></nav></div><div class="frame"><header class="bar"><div class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c-2-3-3-5-6-5a5 5 0 1 0 0 10c3 0 5-4 7-7 2-3 4-4 6-3a5 5 0 0 1-1 10c-3 0-5-4-6-5Z"/></svg>Continuum</div><div class="spacer"></div><span class="tag">快速面板</span><span class="tag">本地工作台</span></header><main class="scroll"><div class="desk"><h1>有什么事要我照看？</h1><form class="composer"><div class="context"></div><div class="entry"><textarea aria-label="发到主对话" placeholder="问进度、交代新任务，或修改要求…" rows="1" required></textarea><button type="submit" aria-label="发送" title="发送（⌘↵）"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 12 6-6 6 6m-6-6v13"/></svg></button></div><div class="hint">⌘ ↵ 发送　·　仅在本页演示，不会创建真实委托</div></form><section><h2>快捷操作</h2><div class="box"><button class="cmd" data-act="status"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><strong>现在都怎么样了？</strong><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v8H5m5-5-5 5 5 5"/></svg></span></button><button class="cmd" data-act="tasks"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16m4-11h5m-5 5h5"/></svg><strong>查看我的委托</strong><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button></div></section><section><h2>最近交付</h2><div class="box"><button class="cmd" data-act="read"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8m-8 4h8m-8 4h4"/></svg><div><strong>给录屏剪掉头尾，不必重新编码</strong><small>热榜关注　09:02</small></div><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button><button class="cmd" data-act="meeting"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16c2-2 2-5 2-7a5 5 0 0 1 10 0c0 3 0 5 2 7H5zm5 3a2 2 0 0 0 4 0"/></svg><div><strong>准备产品周会</strong><small>周五 09:00</small></div><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button></div></section><div class="log" aria-live="polite"></div></div></main></div><dialog aria-labelledby="dialog-title"><div class="row"><h2 id="dialog-title"></h2><button data-act="close">关闭</button></div><div id="dialog-body"></div></dialog><script>
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
const dlg=q('dialog'),field=q('textarea'),ctx=q('.context'),log=q('.log');let target='',selected='report';
function dialog(title,html){q('#dialog-title').textContent=title;q('#dialog-body').innerHTML=html;dlg.showModal()}
function append(who,text){const p=document.createElement('p'),b=document.createElement('b');b.textContent=who;p.append(b,document.createTextNode(text));log.append(p);p.scrollIntoView({block:'nearest'})}
function reply(name){if(dlg.open)dlg.close();target=name;ctx.replaceChildren(document.createTextNode('回复：'+name));const b=document.createElement('button');b.type='button';b.textContent='取消关联';b.onclick=()=>{target='';ctx.replaceChildren();field.focus()};ctx.append(b);field.focus()}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.select){selected=btn.dataset.select;qa('[data-select]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));q('#report').hidden=selected!=='report';q('#meeting').hidden=selected!=='meeting';return}
switch(btn.dataset.act){
case 'close':dlg.close();break;case 'focus':field.focus();break;
case 'detail':{const box=btn.closest('.tools').nextElementSibling;box.hidden=!box.hidden;btn.setAttribute('aria-expanded',String(!box.hidden));btn.textContent=box.hidden?'展开完整结果':'收起结果';break}
case 'tasks':dialog('我的委托',"<ul class=\"tasklist\"><li><b>留意 GitHub 新工具</b><span>每天 09:00 检查</span></li><li><b>准备产品周会</b><span>周五 09:00 提醒</span></li></ul>");break;
case 'read':selected='report';dialog("给录屏剪掉头尾，不必重新编码","<p>LosslessCut 可以从长视频里直接截取片段。如果只是把一次演示剪短发给同事，不必先学完整的剪辑软件。</p><strong>适合什么情况？</strong><p>粗剪录屏、拼接相同编码的片段，或按静音位置拆分。要做字幕排版和转场时，它就不是首选。</p><p class=\"sub\">工具能力来自项目说明。此处为交付排版示例，不表示该项目今天上榜。</p><button class=\"btn\" data-act=\"reply\">回复这条</button>");break;
case 'meeting':selected='meeting';dialog('准备产品周会','<p>周五 09:00 在主对话提醒。</p><button class="btn" data-act="reply">回复这条</button>');break;
case 'reply':reply(selected==='meeting'?'周会提醒':'热榜关注');break;
case 'status':append('当前进度 · 示例',"热榜今天 09:02 已检查，下次明早 09:00；周会提醒已安排在周五 09:00。");break;}});
q('form').onsubmit=e=>{e.preventDefault();let text=field.value.trim();if(!text)return;append(target?'你 · '+target:'你',text);append('原型反馈',/进度|怎么样/.test(text)?"热榜今天 09:02 已检查，下次明早 09:00；周会提醒已安排在周五 09:00。":target?'已在此预览记录对「'+target+'」的回复。':'已在此预览记录新委托。');field.value='';target='';ctx.replaceChildren();field.focus()};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&!dlg.open){e.preventDefault();field.focus()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&document.activeElement===field&&!e.isComposing){e.preventDefault();q('form').requestSubmit()}});
</script></body></html>
